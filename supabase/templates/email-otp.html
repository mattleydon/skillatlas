<!doctype html>
<html lang="en">
  <body style="margin:0;background:#2f3a46;color:#e8eef7;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:520px;margin:0 auto;padding:32px 24px;">
      <p style="margin:0 0 8px;color:#19d3cf;font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;">
        SkillAtlas / Account
      </p>
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.2;">Your verification code</h1>
      <p style="margin:0 0 20px;color:#cbd5e1;font-size:15px;line-height:1.6;">
        Enter this one-time code in SkillAtlas. It expires in 10 minutes.
      </p>
      <p style="margin:0;border:1px solid rgba(203,213,225,0.34);border-radius:8px;background:#273341;padding:16px;color:#19d3cf;font-family:Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:0.18em;text-align:center;">
        {{ .Token }}
      </p>
      <p style="margin:20px 0 0;color:#94a3b8;font-size:13px;line-height:1.5;">
        If you did not request this code, you can ignore this email.
      </p>
    </div>
  </body>
</html>
